name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "endpoint/src/main/resources/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes OpenAPI client generation)
        run: npm run build

      # Non-blocking for now: the existing codebase has ~280 pre-existing lint
      # errors (mostly missing inject()/typed-any modernization tracked in the
      # frontend Angular-22 migration plan). Flip to blocking once that lands.
      - name: Lint
        continue-on-error: true
        run: npx eslint 'src/**/*.ts'

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless
