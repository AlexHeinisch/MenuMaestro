@if (mealId !== undefined) {
  <app-recipe-edit
    [title]="'Edit Meal ' + (meal?.name || '')"
    [hideVisibilityNameAndServings]="true"
    [editRecipeHandler]="editRecipeHandler.bind(this)"
    [fetchRecipeValueHandler]="fetchRecipeValueHandler.bind(this)"
    [redirectPath]="redirectPath"
  ></app-recipe-edit>
}
